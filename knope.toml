[github]
owner = "jeremybanka"
repo = "puggers"

[changes]
ignore_conventional_commits = true

[package]
name = "puggers"
changelog = "CHANGELOG.md"
versioned_files = [
  "Cargo.toml",
  "packages/puggers/package.json",
  { path = "crates/puggers-cli/Cargo.toml", dependency = "puggers-core" },
  { path = "crates/puggers-node/Cargo.toml", dependency = "puggers-core" },
  { path = "Cargo.lock", dependency = "puggers-core" },
  { path = "Cargo.lock", dependency = "puggers" },
  { path = "Cargo.lock", dependency = "puggers-node" },
  { path = "Cargo.lock", dependency = "dprint-plugin-pug" },
]
scopes = ["puggers", "puggers-core", "puggers-node", "dprint-plugin-pug"]

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "version"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "Command"
command = "git switch -C release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows.steps]]
type = "Command"
command = "git commit -m \"chore: prepare release $version\""

[[workflows.steps]]
type = "Command"
command = "git push --force --set-upstream origin release"

[[workflows.steps]]
type = "CreatePullRequest"
base = "main"

[workflows.steps.title]
template = "chore: prepare release $version"

[workflows.steps.body]
template = "This PR was created by Knope. Merging it will publish a new release.\n\n$changelog"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"
