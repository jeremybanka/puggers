[github]
owner = "jeremybanka"
repo = "puggers"

[changes]
ignore_conventional_commits = true

[package]
name = "puggers"
changelog = "CHANGELOG.md"
versioned_files = [
  "Cargo.toml",
  { path = "crates/puggers-cli/Cargo.toml", dependency = "puggers-core" },
  { path = "Cargo.lock", dependency = "puggers-core" },
  { path = "Cargo.lock", dependency = "puggers" },
  { path = "Cargo.lock", dependency = "dprint-plugin-pug" },
]
scopes = ["puggers", "puggers-core", "dprint-plugin-pug"]

[[workflows]]
name = "document-change"

[[workflows.steps]]
type = "CreateChangeFile"

[[workflows]]
name = "prepare-release"

[[workflows.steps]]
type = "PrepareRelease"

[[workflows]]
name = "release"

[[workflows.steps]]
type = "Release"
