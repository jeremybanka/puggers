name: Renovate

on:
  schedule:
    - cron: "0 * * * *"

  workflow_dispatch:

  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  discoverUpgrades:
    name: Discover Upgrades
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ vars.RENOVATE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RENOVATE_APP_PK_FKEYQ6DBN }}
          owner: jeremybanka
          repositories: puggers
          permission-contents: write
          permission-pull-requests: write
          permission-issues: write
          permission-statuses: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: renovatebot/github-action@230ce922b08968d0a4f6f70f295601daff09ef1d # v46.3.7
        env:
          LOG_LEVEL: debug
          RENOVATE_REPOSITORIES: jeremybanka/puggers
        with:
          configurationFile: renovate.json
          token: ${{ steps.app-token.outputs.token }}
