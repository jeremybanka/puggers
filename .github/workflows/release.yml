name: Release

on:
  workflow_dispatch:
    inputs:
      recovery_version:
        description: Recover the partially published release from its original source
        required: true
        type: choice
        options: ["0.1.12"]
  pull_request:
    types: [closed]
    branches: ["main"]

permissions:
  contents: read
  id-token: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  NpmPackageGroup:
    name: npm package group
    if: github.event.pull_request.merged == true && github.event.pull_request.head.ref == 'release'
    uses: ./.github/workflows/npm-package-group.yml
    with:
      publish: true
    permissions:
      contents: read
      id-token: write

  Release:
    name: Release
    if: >-
      always() && (
        (github.event_name == 'pull_request' && github.event.pull_request.merged == true &&
         github.event.pull_request.head.ref == 'release' && needs.NpmPackageGroup.result == 'success') ||
        (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main' &&
         inputs.recovery_version == '0.1.12')
      )
    needs: NpmPackageGroup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        id: app-token
        with:
          client-id: ${{ vars.CHANGESETS_APP_CLIENT_ID }}
          private-key: ${{ secrets.CHANGESETS_APP_PK_SN0ZHPLIA }}
          owner: jeremybanka
          repositories: puggers
          permission-contents: write
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
          ref: ${{ github.event.pull_request.merge_commit_sha || github.sha }}
      - name: Select immutable release source
        id: source
        run: |
          install -m 644 scripts/publish-crates.py "${RUNNER_TEMP}/publish-crates.py"
          if [[ "${RECOVERY}" == 'true' ]]; then
            source='3a5257f08e4a3d465d3be38ec826e8804add9522'
            git merge-base --is-ancestor "${source}" HEAD
            git checkout --detach "${source}"
          fi
          version="$(python3 -c 'import tomllib; print(tomllib.load(open("Cargo.toml", "rb"))["workspace"]["package"]["version"])')"
          if [[ "${RECOVERY}" == 'true' && "${version}" != '0.1.12' ]]; then
            echo 'Recovery source must be version 0.1.12.' >&2
            exit 1
          fi
          echo "version=${version}" >> "${GITHUB_OUTPUT}"
          echo "Release source: $(git rev-parse HEAD), version ${version}"
        env:
          RECOVERY: ${{ github.event_name == 'workflow_dispatch' }}
      - uses: ./.github/actions/setup
      - uses: knope-dev/action@19617851f9f13ab2f27a05989c55efb18aca3675 # v2.1.2
        with:
          version: 0.23.0
      - name: Check recovery packages before obtaining publishing credentials
        if: github.event_name == 'workflow_dispatch'
        run: python3 "${RUNNER_TEMP}/publish-crates.py" preflight 0.1.12 puggers dprint-plugin-pug --require-core
      - uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
        id: crates-io-auth
      - name: Publish Crates
        run: |
          if [[ "${RECOVERY}" == 'true' ]]; then
            python3 "${RUNNER_TEMP}/publish-crates.py" publish 0.1.12 puggers dprint-plugin-pug --require-core
          else
            python3 "${RUNNER_TEMP}/publish-crates.py" publish "${VERSION}" puggers-core puggers dprint-plugin-pug
          fi
        env:
          RECOVERY: ${{ github.event_name == 'workflow_dispatch' }}
          VERSION: ${{ steps.source.outputs.version }}
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io-auth.outputs.token }}
      - run: knope release --verbose
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
