name: Setup
description: Install the Rust toolchain and related dependencies.
runs:
  using: composite
  steps:
    - name: Install Mise
      uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
      with:
        version: 2026.6.5

    - name: Reconcile Rust Toolchain
      shell: bash
      run: mise install --force rust
