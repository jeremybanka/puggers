name: Setup
description: Install the Rust toolchain and related dependencies.
runs:
  using: composite
  steps:
    - name: Install Mise
      uses: jdx/mise-action@8418fedb1110381a0d3ba51a7a415d7c1b884550 # v5.2.2
      with:
        version: 2026.10.17

    - name: Reconcile Rust Toolchain
      shell: bash
      run: mise install --force rust
