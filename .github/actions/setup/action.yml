name: Setup
description: Install the Rust toolchain and related dependencies.
runs:
  using: composite
  steps:
    - name: Install Mise
      uses: jdx/mise-action@fc42bcc7ddbf51124c30f95a877a0c5168a3bfde # v5.2.1
      with:
        version: 2026.10.15

    - name: Reconcile Rust Toolchain
      shell: bash
      run: mise install --force rust
