[package]
name = "dprint-plugin-pug"
version = "0.1.0"
edition = "2024"
description = "A super minimal Pug formatter plugin for dprint."
license = "MIT"
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
anyhow = "1"
dprint-core = { version = "0.67.4", features = ["wasm"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
