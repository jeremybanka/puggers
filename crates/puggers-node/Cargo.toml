[package]
name = "puggers-node"
version.workspace = true
edition = "2024"
description = "Node-API bindings for the puggers HTML to Pug converter."
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = "=3.12.0"
napi-derive = "=3.6.2"
puggers-core = { version = "0.1.11", path = "../puggers-core" }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"

[build-dependencies]
napi-build = "=2.4.1"
