[package]
name = "puggers-node"
version.workspace = true
edition = "2024"
description = "Node-API bindings for the puggers HTML to Pug converter."
license.workspace = true
repository.workspace = true
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
napi = "=3.9.4"
napi-derive = "=3.5.8"
puggers-core = { version = "0.1.9", path = "../puggers-core" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.150"

[build-dependencies]
napi-build = "=2.3.2"
